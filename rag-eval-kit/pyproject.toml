[project]
name = "rag-eval-kit"
version = "0.1.0"
description = "Benchmark RAG pipelines: hit@k, MRR, recall@k, nDCG, faithfulness/relevancy proxies, RAGAS, LLM-judge calibration, latency and cost - with CI gates and HTML reports."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []  # core is stdlib-only

[project.optional-dependencies]
ragas = ["ragas>=0.2", "datasets>=2.19"]

[project.scripts]
rag-eval = "rag_eval_kit.cli:main"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval_kit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
packages = ["rag_eval_kit"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["ragas.*", "datasets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=rag_eval_kit --cov-report=term-missing:skip-covered"
