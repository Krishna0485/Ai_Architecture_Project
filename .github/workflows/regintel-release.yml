name: regintel-release
on:
  push:
    tags: ["regintel-v*.*.*"]
permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, file: infra/docker/Dockerfile.api }
          - { name: worker, file: infra/docker/Dockerfile.worker }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: version
        run: echo "v=${GITHUB_REF_NAME#regintel-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: regintel
          file: regintel/${{ matrix.file }}
          push: true
          tags: ghcr.io/krishna0485/regintel-${{ matrix.name }}:${{ steps.version.outputs.v }}
          provenance: true
          sbom: true

  github-release:
    runs-on: ubuntu-latest
    needs: images
    defaults:
      run:
        working-directory: regintel
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv sync --group dev && uv run python evals/run_eval.py --no-gate
      - name: Release notes = changelog section + eval summary
        run: |
          V="${GITHUB_REF_NAME#regintel-v}"
          {
            awk "/^## \[${V}\]/{flag=1;next}/^## \[/{flag=0}flag" CHANGELOG.md
            echo; echo "## Evaluation summary"; echo
            cat evals/reports/comparison.md
          } > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: regintel/release-notes.md
          files: |
            regintel/evals/reports/summary.json
            regintel/evals/reports/latest.html
