name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: Include the request id / trace id if available }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version / commit }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [ingestion, retrieval, generation, agents, mcp, guardrails, api, infra, evals]
