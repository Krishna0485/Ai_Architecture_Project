{{- range $name, $c := .Values.components }}
{{- if and $c.enabled $c.hpa $c.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "regintel.fullname" $ }}-{{ $name }}
  labels:
    {{- include "regintel.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "regintel.fullname" $ }}-{{ $name }}
  minReplicas: {{ $c.hpa.minReplicas }}
  maxReplicas: {{ $c.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $c.hpa.targetCPU }} }
{{- end }}
{{- end }}
