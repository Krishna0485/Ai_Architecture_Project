{{- if and .Values.pdb.enabled .Values.components.api.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "regintel.fullname" . }}-api
  labels:
    {{- include "regintel.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "regintel.selector" (dict "root" . "name" "api") | nindent 6 }}
{{- end }}
{{- if .Values.secrets.externalSecret.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  labels:
    {{- include "regintel.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    {{- toYaml .Values.secrets.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.secrets.existingSecret }}
  dataFrom:
    - extract:
        key: {{ .Values.secrets.externalSecret.remoteKey }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "regintel.fullname" . }}
  labels:
    {{- include "regintel.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "regintel.fullname" . }}-api
                port: { name: http }
{{- end }}
