{{- range $name, $c := .Values.components }}
{{- if $c.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "regintel.fullname" $ }}-{{ $name }}
  labels:
    {{- include "regintel.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  {{- if not (and $c.hpa $c.hpa.enabled) }}
  replicas: {{ $c.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "regintel.selector" (dict "root" $ "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "regintel.labels" $ | nindent 8 }}
        {{- include "regintel.selector" (dict "root" $ "name" $name) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
    spec:
      serviceAccountName: {{ include "regintel.fullname" $ }}
      automountServiceAccountToken: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: {{ include "regintel.image" (dict "root" $ "component" $c) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- with $c.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "regintel.fullname" $ }}-config
            - secretRef:
                name: {{ $.Values.secrets.existingSecret }}
                optional: true
          {{- if $c.port }}
          ports:
            - name: http
              containerPort: {{ $c.port }}
          {{- end }}
          {{- if and $c.probes $c.probes.path }}
          livenessProbe:
            httpGet: { path: {{ $c.probes.path }}, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: {{ $c.probes.readyPath | default $c.probes.path }}, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet: { path: {{ $c.probes.path }}, port: http }
            failureThreshold: 30
            periodSeconds: 5
          {{- else if and $c.probes $c.probes.tcp }}
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          {{- end }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
{{- end }}
{{- end }}
