# Observability overlay: `make up-obs`
#   Langfuse (LLM traces/cost) http://localhost:3000
#   Grafana (dashboards)       http://localhost:3001  (admin/admin on first login)
#   Prometheus                 http://localhost:9090
services:
  api:
    environment:
      REGINTEL_OTEL_ENABLED: "true"
      REGINTEL_OTEL_ENDPOINT: http://otel-collector:4318/v1/traces
      REGINTEL_LANGFUSE_HOST: http://langfuse:3000

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["../otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4318:4318"]

  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["../prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]

  langfuse-db:
    image: postgres:16.6
    environment: { POSTGRES_PASSWORD: langfuse, POSTGRES_DB: langfuse }

  langfuse:
    image: langfuse/langfuse:2.93.3
    depends_on: [langfuse-db]
    environment:
      DATABASE_URL: postgresql://postgres:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: devonly-change-me
      SALT: devonly-change-me
      TELEMETRY_ENABLED: "false"
    ports: ["3000:3000"]
