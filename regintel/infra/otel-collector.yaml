receivers:
  otlp:
    protocols:
      http: { endpoint: 0.0.0.0:4318 }
processors:
  batch: {}
  # Defence in depth: drop any attribute that could carry raw prompt text.
  attributes/scrub:
    actions:
      - { key: regintel.prompt, action: delete }
      - { key: regintel.question, action: delete }
exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: { insecure: true }
  debug: { verbosity: basic }
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/scrub, batch]
      exporters: [otlp/jaeger, debug]
