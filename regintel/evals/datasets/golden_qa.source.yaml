# Golden Q&A source (v1.0). Human-editable; build golden_qa.jsonl with:
#   python evals/datasets/build_golden.py
# Every answerable item names the relevant section(s) and an `evidence` phrase that must appear
# verbatim in one of them - build_golden.py fails if it does not (guards against bad references).
# Status: draft written from the regulation text; review/extend before quoting numbers externally.
version: "1.0"
items:
  # ---------------- 16 CFR 314 - GLBA Safeguards Rule ----------------
  - q: What is the purpose of the FTC Safeguards Rule in 16 CFR Part 314?
    a: It sets forth standards for developing, implementing and maintaining reasonable administrative, technical and physical safeguards to protect the security, confidentiality and integrity of customer information.
    sections: [16cfr314:314.1]
    evidence: safeguards to protect the security, confidentiality, and integrity of customer information
    tags: [glba, scope]
  - q: Who must the information security program designate to oversee and implement it?
    a: A single qualified individual responsible for overseeing and implementing the information security program and enforcing it.
    sections: [16cfr314:314.4]
    evidence: Designate a qualified individual responsible for overseeing and implementing your information security program
    tags: [glba, governance]
  - q: What must the Safeguards Rule risk assessment identify?
    a: Reasonably foreseeable internal and external risks to the security, confidentiality and integrity of customer information that could result in unauthorized disclosure, misuse, alteration, destruction or other compromise.
    sections: [16cfr314:314.4]
    evidence: reasonably foreseeable internal and external risks to the security, confidentiality, and integrity of customer information
    tags: [glba, risk]
  - q: Does the Safeguards Rule require the risk assessment to be written?
    a: Yes. The information security program must be based on a risk assessment, and the risk assessment must be written.
    sections: [16cfr314:314.4]
    evidence: The risk assessment shall be written
    tags: [glba, risk]
  - q: Does the Safeguards Rule require encryption of customer information at rest and in transit?
    a: Yes. Financial institutions must protect by encryption all customer information held or transmitted, both in transit over external networks and at rest, unless infeasible, in which case effective alternative compensating controls reviewed and approved by the qualified individual may be used.
    sections: [16cfr314:314.4]
    evidence: both in transit over external networks and at rest
    tags: [glba, encryption]
  - q: Who must multi-factor authentication be implemented for under the Safeguards Rule?
    a: For any individual accessing any information system, unless the qualified individual has approved in writing the use of reasonably equivalent or more secure access controls.
    sections: [16cfr314:314.4]
    evidence: Implement multi-factor authentication for any individual accessing any information system
    tags: [glba, mfa]
  - q: How does the Safeguards Rule define multi-factor authentication?
    a: Authentication through verification of at least two of the following types of factors - knowledge factors such as a password, possession factors such as a token, or inherence factors such as biometric characteristics.
    sections: [16cfr314:314.2]
    evidence: verification of at least two of the following types of authentication factors
    tags: [glba, mfa, definitions]
  - q: How soon must customer information be disposed of after it is no longer used?
    a: No later than two years after the last date the information is used in connection with providing a product or service to the customer, unless retention is necessary for business operations or other legitimate purposes, required by law, or targeted disposal is not reasonably feasible.
    sections: [16cfr314:314.4]
    evidence: no later than two years after the last date the information is used in connection with the provision of a product or service
    tags: [glba, retention]
  - q: How often must the data retention policy be reviewed under the Safeguards Rule?
    a: Periodically review the data retention policy to minimize the unnecessary retention of data.
    sections: [16cfr314:314.4]
    evidence: Periodically review your data retention policy to minimize the unnecessary retention of data
    tags: [glba, retention]
  - q: What does the Safeguards Rule require about change management?
    a: Financial institutions must adopt procedures for change management.
    sections: [16cfr314:314.4]
    evidence: Adopt procedures for change management
    tags: [glba, change-management]
  - q: What monitoring of authorized users is required by the Safeguards Rule?
    a: Implement policies, procedures and controls designed to monitor and log the activity of authorized users and detect unauthorized access or use of, or tampering with, customer information by such users.
    sections: [16cfr314:314.4]
    evidence: monitor and log the activity of authorized users
    tags: [glba, monitoring]
  - q: How often is penetration testing required if there is no continuous monitoring?
    a: Annual penetration testing based on relevant identified risks, plus vulnerability assessments, including systemic scans, at least every six months.
    sections: [16cfr314:314.4]
    evidence: Annual penetration testing of your information systems
    tags: [glba, testing]
  - q: How often must vulnerability assessments be performed without continuous monitoring?
    a: At least every six months, and whenever there are material changes to operations or business arrangements or circumstances that may have a material impact on the information security program.
    sections: [16cfr314:314.4]
    evidence: Vulnerability assessments, including any systemic scans or reviews of information systems
    tags: [glba, testing]
  - q: What training must be provided to personnel under the Safeguards Rule?
    a: Security awareness training that is updated as necessary to reflect risks identified by the risk assessment.
    sections: [16cfr314:314.4]
    evidence: security awareness training that is updated as necessary to reflect risks identified by the risk assessment
    tags: [glba, training]
  - q: What steps must a financial institution take to oversee service providers?
    a: Select and retain service providers capable of maintaining appropriate safeguards, require them by contract to implement and maintain such safeguards, and periodically assess them based on the risk they present and the continued adequacy of their safeguards.
    sections: [16cfr314:314.4]
    evidence: Periodically assessing your service providers based on the risk they present
    tags: [glba, vendors]
  - q: What must the written incident response plan address under the Safeguards Rule?
    a: The plan's goals, internal processes for responding, clear roles and responsibilities and levels of decision-making authority, external and internal communications and information sharing, remediation of identified weaknesses, documentation and reporting of security events, and evaluation and revision after a security event.
    sections: [16cfr314:314.4]
    evidence: Establish a written incident response plan
    tags: [glba, incident-response]
  - q: How often must the qualified individual report to the board of directors?
    a: Regularly and at least annually, in writing, to the board of directors or equivalent governing body (or a senior officer if no board exists).
    sections: [16cfr314:314.4]
    evidence: at least annually
    tags: [glba, governance]
  - q: What must the qualified individual's annual report to the board include?
    a: The overall status of the information security program and compliance with the rule, and material matters such as risk assessment, risk management and control decisions, service provider arrangements, testing results, security events or violations and management's responses, and recommendations for changes.
    sections: [16cfr314:314.4]
    evidence: The overall status of the information security program
    tags: [glba, governance]
  - q: When must the FTC be notified of a notification event?
    a: As soon as possible, and no later than 30 days after discovery of the event, if the notification event involves the information of at least 500 consumers.
    sections: [16cfr314:314.4]
    evidence: no later than 30 days after discovery of the event
    tags: [glba, breach-notification]
  - q: How many consumers must be affected before a notification event must be reported to the FTC?
    a: At least 500 consumers.
    sections: [16cfr314:314.4]
    evidence: the information of at least 500 consumers
    tags: [glba, breach-notification]
  - q: What is a notification event under the Safeguards Rule?
    a: Acquisition of unencrypted customer information without the authorization of the individual to whom the information pertains.
    sections: [16cfr314:314.2]
    evidence: Notification event means acquisition of unencrypted customer information without the authorization
    tags: [glba, definitions, breach-notification]
  - q: Which Safeguards Rule requirements do not apply to institutions that maintain customer information on fewer than five thousand consumers?
    a: The written risk assessment requirement in 314.4(b)(1), continuous monitoring or penetration testing and vulnerability assessment in 314.4(d)(2), the written incident response plan in 314.4(h), and the annual board report in 314.4(i).
    sections: [16cfr314:314.6]
    evidence: fewer than five thousand consumers
    tags: [glba, exceptions]
  - q: How does the Safeguards Rule define customer information?
    a: Any record containing nonpublic personal information about a customer of a financial institution, whether in paper, electronic or other form, that is handled or maintained by or on behalf of the institution or its affiliates.
    sections: [16cfr314:314.2]
    evidence: Customer information means any record containing nonpublic personal information
    tags: [glba, definitions]
  - q: What is an authorized user under 16 CFR 314.2?
    a: Any employee, contractor, agent, customer or other person that is authorized to access any of the institution's information systems or data.
    sections: [16cfr314:314.2]
    evidence: Authorized user means any employee, contractor, agent, customer, or other person that is authorized to access any of your information systems or data
    tags: [glba, definitions]
  - q: What are the objectives of an information security program under 314.3?
    a: Insure the security and confidentiality of customer information, protect against anticipated threats or hazards to its security or integrity, and protect against unauthorized access to or use of customer information that could result in substantial harm or inconvenience to any customer.
    sections: [16cfr314:314.3]
    evidence: Insure the security and confidentiality of customer information
    tags: [glba, scope]

  # ---------------- 29 CFR 825 - FMLA ----------------
  - q: How many hours of service must an employee have to be eligible for FMLA leave?
    a: At least 1,250 hours of service with the employer during the 12-month period immediately preceding the commencement of the leave.
    sections: [29cfr825:825.110]
    evidence: 1,250 hours of service
    tags: [fmla, eligibility]
  - q: How long must an employee have worked for the employer to be FMLA eligible?
    a: The employee must have been employed by the employer for at least 12 months; the 12 months need not be consecutive.
    sections: [29cfr825:825.110]
    evidence: need not be consecutive months
    tags: [fmla, eligibility]
  - q: What is the worksite employee threshold for FMLA eligibility?
    a: The employee must be employed at a worksite where 50 or more employees are employed by the employer within 75 miles of that worksite.
    sections: [29cfr825:825.110]
    evidence: within 75 miles of that worksite
    tags: [fmla, eligibility]
  - q: When is a private-sector employer covered by the FMLA?
    a: When it employs 50 or more employees for each working day during each of 20 or more calendar workweeks in the current or preceding calendar year.
    sections: [29cfr825:825.104]
    evidence: 20 or more calendar workweeks in the current or preceding calendar year
    tags: [fmla, coverage]
  - q: How many workweeks of FMLA leave is an eligible employee entitled to?
    a: A total of 12 workweeks of leave during any 12-month period for the qualifying reasons.
    sections: [29cfr825:825.200]
    evidence: total of 12 workweeks of leave during any 12-month period
    tags: [fmla, leave-amount]
  - q: How much military caregiver leave can an eligible employee take?
    a: A total of 26 workweeks of leave during a single 12-month period to care for a covered servicemember with a serious injury or illness.
    sections: [29cfr825:825.200]
    evidence: 26 workweeks
    tags: [fmla, leave-amount, military]
  - q: What methods may an employer use to determine the 12-month FMLA leave period?
    a: The calendar year; any fixed 12-month leave year such as a fiscal year; the 12-month period measured forward from the date the employee's first FMLA leave begins; or a rolling 12-month period measured backward from the date the employee uses FMLA leave.
    sections: [29cfr825:825.200]
    evidence: 12-month period measured backward from the date an employee uses any FMLA leave
    tags: [fmla, leave-amount]
  - q: What are the qualifying reasons for FMLA leave?
    a: Birth of a son or daughter and care for the newborn; placement of a son or daughter for adoption or foster care; care for a spouse, son, daughter or parent with a serious health condition; the employee's own serious health condition making them unable to perform their job; qualifying exigencies arising from a family member's covered active duty; and care for a covered servicemember with a serious injury or illness.
    sections: [29cfr825:825.112]
    evidence: placement with the employee of a son or daughter for adoption or foster care
    tags: [fmla, qualifying-reasons]
  - q: What is a serious health condition under the FMLA?
    a: An illness, injury, impairment or physical or mental condition that involves inpatient care or continuing treatment by a health care provider.
    sections: [29cfr825:825.113]
    evidence: an illness, injury, impairment or physical or mental condition that involves inpatient care
    tags: [fmla, definitions]
  - q: Are the common cold and the flu serious health conditions under the FMLA?
    a: Ordinarily, unless complications arise, the common cold, the flu, ear aches, upset stomach, minor ulcers, headaches other than migraine, routine dental or orthodontia problems and periodontal disease are examples of conditions that do not meet the definition of a serious health condition.
    sections: [29cfr825:825.113]
    evidence: the common cold, the flu, ear aches
    tags: [fmla, definitions]
  - q: Can an expectant mother take FMLA leave for prenatal care?
    a: Yes. A mother is entitled to FMLA leave for incapacity due to pregnancy, for prenatal care, or for her own serious health condition following the birth of the child.
    sections: [29cfr825:825.120]
    evidence: prenatal care
    tags: [fmla, pregnancy]
  - q: When does entitlement to FMLA leave for the birth of a child expire?
    a: It expires at the end of the 12-month period beginning on the date of the birth.
    sections: [29cfr825:825.120]
    evidence: expires at the end of the 12-month period beginning on the date of the birth
    tags: [fmla, pregnancy]
  - q: Can FMLA leave be taken intermittently?
    a: Yes. FMLA leave may be taken intermittently or on a reduced leave schedule under certain circumstances, such as when medically necessary for a serious health condition.
    sections: [29cfr825:825.202]
    evidence: intermittently or on a reduced leave schedule
    tags: [fmla, intermittent]
  - q: Can an employer require an employee to substitute accrued paid leave for unpaid FMLA leave?
    a: Yes. An eligible employee may choose, or the employer may require, the substitution of accrued paid leave for unpaid FMLA leave, in accordance with the employer's normal leave policy.
    sections: [29cfr825:825.207]
    evidence: substitute accrued paid leave for FMLA leave
    tags: [fmla, paid-leave]
  - q: What must an employer do about group health coverage during FMLA leave?
    a: Maintain the employee's coverage under any group health plan on the same conditions as coverage would have been provided if the employee had been continuously employed during the leave.
    sections: [29cfr825:825.209]
    evidence: on the same conditions as coverage would have been provided if the employee had been continuously employed
    tags: [fmla, benefits]
  - q: What job is an employee entitled to on return from FMLA leave?
    a: The same position the employee held when leave commenced, or an equivalent position with equivalent benefits, pay and other terms and conditions of employment.
    sections: [29cfr825:825.214]
    evidence: an equivalent position with equivalent benefits, pay, and other terms and conditions of employment
    tags: [fmla, reinstatement]
  - q: Can an employer use FMLA leave as a negative factor in hiring, promotion or discipline decisions?
    a: No. Employers cannot use the taking of FMLA leave as a negative factor in employment actions such as hiring, promotions or disciplinary actions, nor count FMLA leave under no fault attendance policies.
    sections: [29cfr825:825.220]
    evidence: negative factor in employment actions
    tags: [fmla, retaliation]
  - q: What prohibited acts does the FMLA place on employers?
    a: Employers are prohibited from interfering with, restraining or denying the exercise of FMLA rights, and from discharging or discriminating against any person for opposing any practice made unlawful by the Act or for involvement in proceedings under it.
    sections: [29cfr825:825.220]
    evidence: prohibited from interfering with, restraining, or denying the exercise of
    tags: [fmla, retaliation]
  - q: What general notice must every FMLA-covered employer post?
    a: Every covered employer must post, and keep posted on its premises in conspicuous places where employees are employed, a notice explaining the Act's provisions and providing information on filing complaints of violations with the Wage and Hour Division.
    sections: [29cfr825:825.300]
    evidence: keep posted on its premises
    tags: [fmla, notices]
  - q: How quickly must an employer provide the FMLA eligibility notice?
    a: Within five business days of the employee requesting leave or of the employer acquiring knowledge that an employee's leave may be for an FMLA-qualifying reason, absent extenuating circumstances.
    sections: [29cfr825:825.300]
    evidence: within five business days
    tags: [fmla, notices]
  - q: How much advance notice must an employee give for foreseeable FMLA leave?
    a: At least 30 days advance notice before the leave is to begin; if 30 days is not practicable, notice as soon as practicable.
    sections: [29cfr825:825.302]
    evidence: at least 30 days advance notice
    tags: [fmla, employee-notice]
  - q: How long must employers keep FMLA records?
    a: For no less than three years.
    sections: [29cfr825:825.500]
    evidence: no less than three years
    tags: [fmla, records]
  - q: How must medical records related to FMLA be maintained?
    a: Records and documents relating to certifications, recertifications or medical histories must be maintained as confidential medical records in separate files from the usual personnel files.
    sections: [29cfr825:825.500]
    evidence: maintained as confidential medical records in separate files/records from the usual personnel files
    tags: [fmla, records, privacy]
  - q: What does the FMLA allow employees to do according to 825.100?
    a: Eligible employees of covered employers may take job-protected, unpaid leave, or substitute appropriate paid leave, for up to a total of 12 workweeks in any 12 months for certain family and medical reasons.
    sections: [29cfr825:825.100]
    evidence: job-protected, unpaid leave
    tags: [fmla, scope]

  # ---------------- 12 CFR 1002 - Regulation B (ECOA) ----------------
  - q: What is the purpose of Regulation B?
    a: To promote the availability of credit to all creditworthy applicants without regard to race, color, religion, national origin, sex, marital status or age (provided the applicant has the capacity to contract), receipt of public assistance income, or good faith exercise of rights under the Consumer Credit Protection Act.
    sections: [12cfr1002:1002.1]
    evidence: promote the availability of credit to all creditworthy applicants
    tags: [regb, scope]
  - q: What is the general rule against discrimination in Regulation B?
    a: A creditor shall not discriminate against an applicant on a prohibited basis regarding any aspect of a credit transaction.
    sections: [12cfr1002:1002.4]
    evidence: shall not discriminate against an applicant on a prohibited basis regarding any aspect of a credit transaction
    tags: [regb, discrimination]
  - q: Can a creditor discourage applicants from applying for credit on a prohibited basis?
    a: No. A creditor shall not make any oral or written statement, in advertising or otherwise, to applicants or prospective applicants that would discourage on a prohibited basis a reasonable person from making or pursuing an application.
    sections: [12cfr1002:1002.4]
    evidence: would discourage on a prohibited basis a reasonable person from making or pursuing an application
    tags: [regb, discrimination]
  - q: May a creditor ask about an applicant's race, color, religion, national origin or sex?
    a: Generally no. A creditor shall not inquire about the race, color, religion, national origin or sex of an applicant or any other person in connection with a credit transaction, except as permitted for monitoring or self-testing purposes.
    sections: [12cfr1002:1002.5]
    evidence: shall not inquire about the race, color, religion, national origin, or sex of an applicant
    tags: [regb, information-requests]
  - q: Can a creditor consider an applicant's age when evaluating creditworthiness?
    a: A creditor may not take age into account in a credit scoring system except under an empirically derived, demonstrably and statistically sound system where age is not assigned a negative factor for elderly applicants; in judgmental systems age may be considered only for a pertinent element of creditworthiness.
    sections: [12cfr1002:1002.6]
    evidence: demonstrably and statistically sound, credit scoring system
    tags: [regb, evaluation]
  - q: Can a creditor refuse to grant an individual account to a creditworthy applicant because of sex or marital status?
    a: No. A creditor shall not refuse to grant an individual account to a creditworthy applicant on the basis of sex, marital status or any other prohibited basis.
    sections: [12cfr1002:1002.7]
    evidence: shall not refuse to grant an individual account to a creditworthy applicant on the basis of sex, marital status
    tags: [regb, extensions]
  - q: Within how many days must a creditor notify an applicant of action taken on a completed application?
    a: Within 30 days after receiving a completed application concerning the creditor's approval of, counteroffer to, or adverse action on the application.
    sections: [12cfr1002:1002.9]
    evidence: 30 days after receiving a completed application
    tags: [regb, notifications]
  - q: What must a notification of adverse action contain?
    a: A statement of the action taken, the ECOA anti-discrimination notice with the name and address of the federal agency that administers compliance, and either a statement of specific reasons for the action taken or a disclosure of the applicant's right to a statement of specific reasons.
    sections: [12cfr1002:1002.9]
    evidence: statement of specific reasons
    tags: [regb, notifications, adverse-action]
  - q: How long must a creditor retain records for consumer credit applications?
    a: For 25 months (12 months for business credit) after the date the creditor notifies an applicant of action taken on an application or of incompleteness.
    sections: [12cfr1002:1002.12]
    evidence: For 25 months (12 months for business credit
    tags: [regb, records]
  - q: What information must creditors collect for monitoring purposes on home mortgage applications?
    a: For applications for credit primarily for the purchase or refinancing of a dwelling occupied as a principal residence, the creditor must request ethnicity, race, sex, marital status and age of the applicant.
    sections: [12cfr1002:1002.13]
    evidence: purchase or refinancing of a dwelling occupied or to be occupied by the applicant as a principal residence
    tags: [regb, monitoring]
  - q: When must a creditor provide copies of appraisals to applicants for first-lien dwelling loans?
    a: Promptly upon completion, or three business days before consummation of the transaction (or account opening for open-end credit), whichever is earlier.
    sections: [12cfr1002:1002.14]
    evidence: three business days prior to consummation
    tags: [regb, appraisals]
  - q: Can a creditor charge applicants for copies of appraisals?
    a: No. A creditor shall not charge an applicant for providing a copy of appraisals and other written valuations, although it may charge a reasonable fee for the cost of the appraisal itself unless otherwise provided by law.
    sections: [12cfr1002:1002.14]
    evidence: shall not charge an applicant for providing a copy of appraisals
    tags: [regb, appraisals]
  - q: Can a creditor require the signature of an applicant's spouse on a credit instrument?
    a: Generally a creditor shall not require the signature of an applicant's spouse or other person, other than a joint applicant, on any credit instrument if the applicant qualifies under the creditor's standards of creditworthiness for the amount and terms requested.
    sections: [12cfr1002:1002.7]
    evidence: shall not require the signature of an applicant's spouse or other person, other than a joint applicant
    tags: [regb, extensions]

