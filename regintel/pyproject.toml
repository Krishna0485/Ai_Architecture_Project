[project]
name = "regintel"
version = "1.0.0"
description = "Agentic compliance intelligence platform: hybrid RAG, multi-agent checks with human review, MCP, evaluation, guardrails and observability."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Krishna" }]
keywords = ["rag", "llm", "langgraph", "agents", "mcp", "evaluation", "compliance"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
# Core dependencies are deliberately light: the whole platform runs offline ("lite mode")
# with pure-Python retrieval and a deterministic local model. Heavy/infra backends are extras.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "langgraph>=0.2.60",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "mcp>=1.9,<2",  # FastMCP API; see docs/adr/0006-mcp-sdk-version.md
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
# Dense embeddings (BGE), cross-encoder reranking and Docling PDF parsing.
ml = ["sentence-transformers>=3.0", "docling>=2.5"]
# Production stores: Qdrant, OpenSearch, PostgreSQL (metadata, audit, LangGraph checkpoints), Redis.
stores = [
  "qdrant-client>=1.10",
  "opensearch-py>=2.6",
  "psycopg[binary]>=3.2",
  "langgraph-checkpoint-postgres>=2.0",
  "redis>=5.0",
]
# Presidio NER-based PII detection (regex recognisers are built in).
guardrails = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
# OTLP export + Langfuse LLM tracing.
observability = ["opentelemetry-exporter-otlp>=1.25", "langfuse>=2.50"]
ui = ["streamlit>=1.38"]
all = ["regintel[ml,stores,guardrails,observability,ui]"]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
  "pre-commit>=3.8",
]
eval = ["ragas>=0.2"]

[project.scripts]
regintel-ingest = "regintel.ingestion.pipeline:main"
regintel-mcp = "regintel.mcp_server.__main__:main"
regintel-worker = "regintel.worker:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regintel"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["infra", "ui/.streamlit"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "RUF"] # S = security checks (bandit)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311"]
"evals/**" = ["S101", "S311"]
"benchmarks/**" = ["S311"]
"data/scripts/**" = ["S311", "S310"]
# Embedded synthetic policy prose; wrapping it would change the generated documents.
"data/scripts/generate_synthetic_docs.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["regintel"]
mypy_path = "src"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
  "sentence_transformers.*", "docling.*", "qdrant_client.*", "opensearchpy.*", "psycopg.*",
  "presidio_analyzer.*", "presidio_anonymizer.*", "langfuse.*", "redis.*", "ragas.*",
  "langgraph.checkpoint.postgres.*", "opentelemetry.exporter.*", "streamlit.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--cov=regintel --cov-report=term-missing:skip-covered"
markers = [
  "integration: needs the in-process stack (no external services)",
  "docker: needs docker compose services (make up)",
  "e2e: end-to-end workflow tests",
]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["regintel"]
omit = ["src/regintel/storage/qdrant_store.py", "src/regintel/storage/opensearch_store.py",
        "src/regintel/storage/postgres.py", "src/regintel/worker.py"]

[tool.coverage.report]
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
