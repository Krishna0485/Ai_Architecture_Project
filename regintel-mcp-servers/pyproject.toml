[project]
name = "regintel-mcp-servers"
version = "0.1.0"
description = "Reusable, secure MCP servers: tenant-scoped document store, compliance checklists and a ticketing mock with approvals."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["mcp>=1.9,<2", "pydantic>=2.7"]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["servers", "shared"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
packages = ["servers", "shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--cov=servers --cov=shared --cov-report=term-missing:skip-covered"
